<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">五数概括箱线图</title>
  <desc id="desc">左须端点24，第一四分位数37，中位数46，第三四分位数78，右须端点91。</desc>
  <rect width="1200" height="360" rx="28" fill="#f7f3eb"/>
  <line x1="110" y1="270" x2="1090" y2="270" stroke="#b8afa2" stroke-width="3"/>
  <g stroke="#b8afa2" stroke-width="3" fill="none">
    <line x1="190" y1="260" x2="190" y2="282"/><line x1="390" y1="260" x2="390" y2="282"/>
    <line x1="590" y1="260" x2="590" y2="282"/><line x1="790" y1="260" x2="790" y2="282"/>
    <line x1="990" y1="260" x2="990" y2="282"/>
  </g>
  <g font-family="Arial, PingFang SC, sans-serif" font-size="30" fill="#655f55" text-anchor="middle">
    <text x="190" y="324">20</text><text x="390" y="324">40</text><text x="590" y="324">60</text>
    <text x="790" y="324">80</text><text x="990" y="324">100</text>
  </g>
  <g stroke="#2f756b" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="230" y1="145" x2="360" y2="145"/><line x1="770" y1="145" x2="900" y2="145"/>
    <line x1="230" y1="105" x2="230" y2="185"/><line x1="900" y1="105" x2="900" y2="185"/>
  </g>
  <rect x="360" y="85" width="410" height="120" rx="12" fill="#dcece6" stroke="#2f756b" stroke-width="8"/>
  <line x1="450" y1="85" x2="450" y2="205" stroke="#dc8b45" stroke-width="10"/>
  <g font-family="Arial, PingFang SC, sans-serif" font-size="28" fill="#292c28" text-anchor="middle">
    <text x="230" y="58">最小值 24</text><text x="360" y="242">Q₁ = 37</text>
    <text x="450" y="58">中位数 46</text><text x="770" y="242">Q₃ = 78</text><text x="900" y="58">最大值 91</text>
  </g>
</svg>
